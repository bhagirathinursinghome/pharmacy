<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2563eb">
<title>Stock Count</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  *{box-sizing:border-box}
  body{font-family:system-ui,Arial,sans-serif;background:#f3f5f9;margin:0;padding:16px;color:#1b2430}
  .card{max-width:520px;margin:0 auto;background:#fff;border-radius:14px;padding:20px;box-shadow:0 2px 12px rgba(0,0,0,.08)}
  h1{font-size:20px;margin:0 0 4px}
  .sub{color:#667;font-size:13px;margin-bottom:16px}
  label{display:block;font-weight:600;font-size:13px;margin:14px 0 6px}
  input{width:100%;padding:12px;font-size:17px;border:1px solid #c8cfda;border-radius:10px}
  input:focus{outline:2px solid #3b82f6;border-color:#3b82f6}
  .row{display:flex;gap:12px}.row>div{flex:1}
  .wrap{position:relative}
  #sug{position:absolute;left:0;right:0;top:100%;background:#fff;border:1px solid #c8cfda;border-radius:10px;max-height:260px;overflow:auto;z-index:10;display:none;box-shadow:0 6px 18px rgba(0,0,0,.12)}
  #sug div{padding:10px 12px;cursor:pointer;border-bottom:1px solid #eef0f4;font-size:15px}
  #sug div:last-child{border:0}
  #sug div:hover,#sug div.act{background:#eaf2ff}
  #sug small{color:#889}
  .picked{margin-top:8px;padding:8px 12px;background:#eaf2ff;border-radius:8px;font-size:14px;display:none}
  button{width:100%;margin-top:18px;padding:14px;font-size:17px;font-weight:600;border:0;border-radius:10px;background:#2563eb;color:#fff;cursor:pointer}
  button:disabled{background:#9db4e6}
  #res{margin-top:18px;padding:16px;border-radius:12px;font-size:20px;font-weight:700;text-align:center;display:none}
  .MATCH{background:#dcfce7;color:#166534}.MORE{background:#fef3c7;color:#92400e}.LESS{background:#fee2e2;color:#991b1b}
  #msg{margin-top:10px;font-size:13px;color:#b91c1c}
  #cnt{margin-top:14px;font-size:12px;color:#889;text-align:center}
  .seg{display:flex;gap:10px}
  .seg label{flex:1;margin:0;text-align:center;padding:12px;border:2px solid #c8cfda;border-radius:10px;cursor:pointer;font-size:15px}
  .seg input{display:none}
  .seg label:has(input:checked){border-color:#2563eb;background:#eaf2ff;color:#1d4ed8}
  .done{margin-top:10px;padding:12px;border-radius:10px;background:#fee2e2;color:#991b1b;font-weight:700;text-align:center;display:none}

  input[type=date]{min-height:54px;font-size:18px;padding:12px 14px;border-radius:12px;background:#fff}
  .expwarn{display:none;margin-top:8px;padding:10px 12px;border-radius:10px;font-weight:700;text-align:center;background:#ede9fe;color:#5b21b6}
  .expwarn.bad{background:#fee2e2;color:#991b1b}
  button.addmore{display:none;margin-top:10px;background:#0f766e;min-height:54px;font-size:17px;border-radius:14px}
  .sofar{display:none;margin-top:8px;font-size:15px;font-weight:600;color:#334;text-align:center}
  /* ---------- mobile-first overrides ---------- */
  html{-webkit-text-size-adjust:100%}
  *{-webkit-tap-highlight-color:transparent}
  body{padding:10px 10px calc(24px + env(safe-area-inset-bottom));min-height:100vh}
  .card{padding:16px;border-radius:16px;width:100%}
  h1{font-size:22px}
  label{font-size:14px;margin:16px 0 8px}
  input[type=text],input[type=number],input:not([type]){min-height:54px;font-size:18px;padding:12px 14px;border-radius:12px}
  input[type=number]{-moz-appearance:textfield;text-align:center;font-size:24px;font-weight:700}
  input[type=number]::-webkit-outer-spin-button,input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
  .seg label{min-height:54px;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;margin:0;user-select:none}
  #sug{max-height:42vh;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;border-radius:12px}
  #sug div{padding:14px;font-size:16px;line-height:1.3;touch-action:manipulation}
  #sug div small{display:block;margin-top:2px}
  .picked{font-size:15px;padding:10px 12px;border-radius:10px;word-break:break-word}
  .done{font-size:18px;padding:16px;border-radius:12px}
  button#go{min-height:58px;font-size:19px;border-radius:14px;position:sticky;bottom:calc(10px + env(safe-area-inset-bottom));box-shadow:0 6px 18px rgba(37,99,235,.35);touch-action:manipulation}
  button#go:active{transform:scale(.98)}
  #res{font-size:22px;padding:20px 12px;border-radius:14px;line-height:1.3}
  @media (max-width:380px){ .row{gap:8px} h1{font-size:20px} }
  @media (min-width:600px){ body{padding:24px} }
</style>
</head>
<body>
<div class="card">
  <h1>Stock Count</h1>
  <div class="sub">Type the medicine name, pick it, enter FULL and PART, then submit.</div>

  <label>Type</label>
  <div class="seg">
    <label><input type="radio" name="ctype" value="IPD"> IPD</label>
    <label><input type="radio" name="ctype" value="DISPENSARY"> DISPENSARY</label>
  </div>

  <label>Medicine name</label>
  <div class="wrap">
    <input id="q" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="search" placeholder="Start typing..." disabled>
    <div id="sug"></div>
  </div>
  <div class="picked" id="picked"></div>
  <div class="done" id="done"></div>
  <div class="sofar" id="sofar"></div>
  <button type="button" class="addmore" id="addmore">+ Add more of this medicine</button>

  <div class="row">
    <div><label>FULL</label><input id="full" type="number" min="0" inputmode="numeric" pattern="[0-9]*" enterkeyhint="next" placeholder="0"></div>
    <div><label>PART</label><input id="part" type="number" min="0" inputmode="numeric" pattern="[0-9]*" enterkeyhint="done" placeholder="0"></div>
  </div>

  <label>Expiry date</label>
  <input id="exp" type="date">
  <div class="expwarn" id="expwarn"></div>

  <label>Remark <span style="font-weight:400;color:#889">(optional)</span></label>
  <input id="remark" type="text" maxlength="200" autocomplete="off" enterkeyhint="done" placeholder="e.g. damaged box, near expiry...">

  <button id="go" disabled>Submit</button>
  <div id="res"></div>
  <div id="msg"></div>
  <div id="cnt"></div>
</div>

<script>
const SUPABASE_URL = "https://sfnaiezkemdjjcbxfuzw.supabase.co";
const SUPABASE_KEY = "sb_publishable_tzf_Bhqi-QFGdVtYfKo9dw_QqwXD5hv";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const $ = id => document.getElementById(id);
let meds = [], picked = null, activeIdx = -1, shown = [], countedSet = new Set();
let existing = { f: 0, p: 0, n: 0 }, addMode = false;
function resetAdd() {
  addMode = false; existing = { f: 0, p: 0, n: 0 };
  $('addmore').style.display = 'none'; $('sofar').style.display = 'none';
  $('go').textContent = 'Submit';
}

function todayStr() {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}
const isExpired = v => !!v && v < todayStr();   // expiry date before today = expired

function showExpWarn() {
  const v = $('exp').value, w = $('expwarn');
  if (!v) { w.style.display = 'none'; return; }
  w.style.display = 'block';
  if (isExpired(v)) { w.className = 'expwarn bad'; w.textContent = '⚠ EXPIRED'; }
  else if (v === todayStr()) { w.className = 'expwarn'; w.textContent = 'Expires today'; }
  else { w.style.display = 'none'; }
}

async function loadAll(table, cols) {
  let out = [], from = 0;
  while (true) {
    const { data, error } = await sb.from(table).select(cols).order('id').range(from, from + 999);
    if (error) throw error;
    out = out.concat(data);
    if (data.length < 1000) break;
    from += 1000;
  }
  return out;
}

async function init() {
  try {
    meds = await loadAll('stock_master', 'id,code,medicine_name,full_qty,part_qty');
    $('q').disabled = false;
    $('q').placeholder = meds.length ? 'Start typing...' : 'No stock uploaded yet';
    refreshCount();
  } catch (e) { $('msg').textContent = 'Could not load medicines: ' + e.message; }
}

async function refreshCount() {
  try {
    const rows = await loadAll('stock_count', 'id,code');
    countedSet = new Set(rows.map(r => r.code));
  } catch (e) {}
  $('cnt').textContent = `Counted so far: ${countedSet.size} of ${meds.length}`;
}

function renderSug(list) {
  shown = list; activeIdx = -1;
  const box = $('sug');
  if (!list.length) { box.style.display = 'none'; return; }
  box.innerHTML = list.map((m, i) => `<div data-i="${i}">${esc(m.medicine_name)} <small>${esc(m.code)}</small>${countedSet.has(m.code) ? ' <small style="color:#b91c1c;font-weight:700">✔ counted</small>' : ''}</div>`).join('');
  box.style.display = 'block';
}
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

$('q').addEventListener('input', () => {
  picked = null; $('picked').style.display = 'none'; $('go').disabled = true;
  $('done').style.display = 'none'; resetAdd();
  const t = $('q').value.trim().toLowerCase();
  if (!t) return renderSug([]);
  const words = t.split(/\s+/);
  const starts = [], contains = [];
  for (const m of meds) {
    const n = m.medicine_name.toLowerCase();
    if (!words.every(w => n.includes(w))) continue;
    (n.startsWith(t) ? starts : contains).push(m);
    if (starts.length + contains.length >= 60) break;
  }
  renderSug(starts.concat(contains).slice(0, 12));
});

// keep the search box visible above the on-screen keyboard
$('q').addEventListener('focus', () => setTimeout(() => $('q').scrollIntoView({ block: 'start', behavior: 'smooth' }), 250));
// Enter on FULL -> PART, Enter on PART -> submit
$('full').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); $('part').focus(); } });
$('part').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); if (!$('go').disabled) $('go').click(); $('part').blur(); } });
$('addmore').addEventListener('click', () => {
  if (!picked) return;
  addMode = true;
  lockEntry(false);
  $('done').style.display = 'none'; $('addmore').style.display = 'none'; $('msg').textContent = '';
  $('go').textContent = 'Add to count'; $('go').disabled = false;
  $('full').focus();
});
$('exp').addEventListener('input', showExpWarn);
$('exp').addEventListener('change', showExpWarn);
$('remark').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); $('remark').blur(); } });
$('full').addEventListener('focus', e => e.target.select());
$('part').addEventListener('focus', e => e.target.select());

$('q').addEventListener('keydown', e => {
  const items = $('sug').children;
  if (e.key === 'ArrowDown' && items.length) { activeIdx = (activeIdx + 1) % items.length; hl(items); e.preventDefault(); }
  else if (e.key === 'ArrowUp' && items.length) { activeIdx = (activeIdx - 1 + items.length) % items.length; hl(items); e.preventDefault(); }
  else if (e.key === 'Enter' && activeIdx >= 0) { choose(shown[activeIdx]); e.preventDefault(); }
});
function hl(items) { [...items].forEach((el, i) => el.classList.toggle('act', i === activeIdx)); }

$('sug').addEventListener('mousedown', e => {
  const d = e.target.closest('div[data-i]');
  if (d) choose(shown[+d.dataset.i]);
});
document.addEventListener('click', e => { if (!e.target.closest('.wrap')) $('sug').style.display = 'none'; });

function lockEntry(locked) {
  $('full').disabled = locked; $('part').disabled = locked;
  $('exp').disabled = locked; $('remark').disabled = locked;
  if (locked) { $('full').value = ''; $('part').value = ''; $('exp').value = ''; $('remark').value = ''; $('expwarn').style.display = 'none'; $('go').disabled = true; }
}

async function choose(m) {
  picked = m;
  $('q').value = m.medicine_name;
  $('sug').style.display = 'none';
  $('picked').style.display = 'block';
  $('picked').textContent = 'Selected: ' + m.medicine_name + '  (' + m.code + ')';
  $('res').style.display = 'none'; $('msg').textContent = ''; $('done').style.display = 'none';
  resetAdd(); lockEntry(false); $('go').disabled = true;
  // check the database for the latest status
  const { data, error } = await sb.from('stock_count').select('code,count_type,counted_full,counted_part').eq('code', m.code);
  if (picked !== m) return;
  if (error) { $('msg').textContent = 'Could not check status: ' + error.message; return; }
  if (data.length) {
    countedSet.add(m.code);
    existing = { f: data.reduce((a, r) => a + r.counted_full, 0), p: data.reduce((a, r) => a + r.counted_part, 0), n: data.length };
    const types = [...new Set(data.map(r => r.count_type).filter(Boolean))];
    $('done').textContent = '✔ ALREADY COUNTED' + (types.length ? ' (' + types.join(' + ') + ')' : '');
    $('done').style.display = 'block';
    $('sofar').textContent = 'Counted so far: ' + existing.f + ' full / ' + existing.p + ' part' + (existing.n > 1 ? ' (' + existing.n + ' entries)' : '');
    $('sofar').style.display = 'block';
    $('addmore').style.display = 'block';
    lockEntry(true);
    return;
  }
  $('go').disabled = false;
  $('full').focus();
}

function compare(cf, cp, sf, sp) {
  if (cf === sf && cp === sp) return 'MATCH';
  if (cf !== sf) return cf > sf ? 'MORE' : 'LESS';
  return cp > sp ? 'MORE' : 'LESS';
}

$('go').addEventListener('click', async () => {
  $('msg').textContent = '';
  if (!picked) return;
  const ctEl = document.querySelector('input[name="ctype"]:checked');
  if (!ctEl) { $('msg').textContent = 'Select type: IPD or DISPENSARY.'; return; }
  const cf = parseInt($('full').value || '0', 10), cp = parseInt($('part').value || '0', 10);
  if (isNaN(cf) || isNaN(cp) || cf < 0 || cp < 0) { $('msg').textContent = 'Enter valid FULL and PART numbers.'; return; }
  const totF = cf + (addMode ? existing.f : 0), totP = cp + (addMode ? existing.p : 0);
  const status = compare(totF, totP, picked.full_qty, picked.part_qty);
  const expVal = $('exp').value || null;
  const remarkVal = $('remark').value.trim() || null;
  const expired = isExpired(expVal);
  $('go').disabled = true;
  const { error } = await sb.from('stock_count').insert({
    code: picked.code, medicine_name: picked.medicine_name,
    sys_full: picked.full_qty, sys_part: picked.part_qty,
    counted_full: cf, counted_part: cp, status, count_type: ctEl.value, expiry_date: expVal, remark: remarkVal, is_additional: addMode,
    counted_at: new Date().toISOString()
  });
  if (error) {
    if (error.code === '23505' && addMode) {
      $('msg').textContent = 'Cannot add more yet: run the latest setup.sql in Supabase first.'; $('go').disabled = false;
    } else if (error.code === '23505') {
      countedSet.add(picked.code);
      choose(picked);
    } else { $('msg').textContent = 'Save failed: ' + error.message; $('go').disabled = false; }
    return;
  }
  countedSet.add(picked.code);
  const r = $('res');
  r.className = status; r.style.display = 'block';
  r.textContent = status === 'MATCH' ? '✔ Quantity MATCHES' : status === 'MORE' ? '▲ Counted is GREATER than stock' : '▼ Counted is LESS than stock';
  if (addMode) {
    const t = document.createElement('div');
    t.textContent = 'Total counted now: ' + totF + ' full / ' + totP + ' part';
    t.style.cssText = 'margin-top:8px;font-size:16px;font-weight:600';
    r.appendChild(t);
  }
  if (expired) {
    const x = document.createElement('div');
    x.textContent = '⚠ EXPIRED (' + expVal + ')';
    x.style.cssText = 'margin-top:10px;padding:8px;border-radius:10px;background:#7f1d1d;color:#fff;font-size:18px';
    r.appendChild(x);
  }
  // reset for next medicine
  picked = null; $('q').value = ''; $('full').value = ''; $('part').value = '';
  $('exp').value = ''; $('remark').value = ''; $('expwarn').style.display = 'none';
  $('picked').style.display = 'none'; $('go').disabled = true; resetAdd();
  $('cnt').textContent = `Counted so far: ${countedSet.size} of ${meds.length}`;
  if (navigator.vibrate) navigator.vibrate(status === 'MATCH' ? 60 : [80, 60, 80]);
  r.scrollIntoView({ block: 'center', behavior: 'smooth' });
});

init();
</script>
</body>
</html>
